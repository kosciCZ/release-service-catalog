---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: rh-sign-rpm
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: sign-rpm
spec:
  description: |-
    Tekton task to create internalrequests to sign RPMs
  params:
    - name: snapshotPath
      type: string
      description: |
        Path to the JSON file of the mapped Snapshot spec in the data workspace
    - name: dataPath
      type: string
      description: |
        Path to the JSON file of the merged data to use in the data workspace
    - name: snapshotBuildId
      type: string
      description: |
        Pulp repository name to use for RPM signing. If provided, this value is used directly.
        If empty, repositories are determined dynamically from the architectures in artifacts.json
      default: ""
    - name: releasePlanAdmissionPath
      description: Path to the JSON string of the releasePlanAdmission in the data workspace
      type: string
    - name: artifactsJsonPath
      type: string
      description: |
        Path to the artifacts.json file in the data workspace (pulp-tool format with RPM metadata)
      default: "artifacts.json"
    - name: requester
      type: string
      description: Name of the user that requested the signing, for auditing purposes
    - name: requestTimeout
      type: string
      default: "1800"
      description: InternalRequest timeout
    - name: pipelineRunUid
      type: string
      description: The uid of the current pipelineRun. Used as a label value when creating internal requests
    - name: ociStorage
      description: The OCI repository where the Trusted Artifacts are stored
      type: string
      default: "empty"
    - name: sourceDataArtifact
      type: string
      description: Location of trusted artifacts to be used to populate data directory
      default: ""
    - name: ociArtifactExpiresAfter
      description: >-
        Expiration date for the trusted artifacts created in the OCI repository.
        An empty string means the artifacts do not expire
      type: string
      default: "1d"
    - name: trustedArtifactsDebug
      description: Flag to enable debug logging in trusted artifacts. Set to a non-empty string to enable
      type: string
      default: ""
    - name: orasOptions
      description: oras options to pass to Trusted Artifacts calls
      type: string
      default: ""
    - name: dataDir
      description: The location where data will be stored
      type: string
      default: /var/workdir/release
    - name: taskGitUrl
      type: string
      description: The url to the git repo where the release-service-catalog tasks and stepactions to be used are stored
    - name: taskGitRevision
      type: string
      description: The revision in the taskGitUrl repo to be used
    # - name: unsignedRpmsDomain
    #   type: string
    #   description: The domain to use for pulling unsigned RPMs
    #   default: rok-storage
    - name: signedRpmsDomain
      type: string
      description: The domain to use for pushing signed RPMs
      # default: rok-storage
      default: konflux-direct-signing-test
    - name: unsignedRpmsSubpath
      type: string
      description: |
        Subpath appended after the repo for unsigned RPMs location (e.g., "rpms" results in domain/repo/rpms).
        Set to empty string for no subpath
      default: "rpms"
    - name: signedRpmsSubpath
      type: string
      description: |
        Subpath appended after the repo for signed RPMs destination
        (e.g., "rpms-signed" results in domain/repo/rpms-signed).
        Set to empty string for no subpath
      default: "rpms-signed"
    # - name: signedRpmsUploadSubpath
    #   type: string
    #   description: |
    #     Subpath for uploading signed RPMs within the signing pipeline.
    #     Set to empty string for no subpath
    #   default: ""
    - name: pipelineImage
      type: string
      description: Container image to use for the signing pipeline
      # default: "quay.io/konflux-ci/signing:latest"
      default: "quay.io/araszka/signing:latest-fix"
    - name: signingRepo
      type: string
      description: Git repository URL containing the signing tasks
      default: "https://gitlab.cee.redhat.com/signing/signing.git"
    - name: signingRevision
      type: string
      description: Git revision (branch, tag, or commit) in the signing repository
      default: "350aba48d7ce3c2dd52d0e50efa75cfd5e22cc48"
    - name: signPipeline
      type: string
      description: Name of the internal pipeline to use for RPM signing
      default: "direct-rpm-signing"
    - name: signPipelineServiceAccount
      type: string
      description: Service account to use for the signing pipeline
      default: "signing-pipeline-sa"
  results:
    - name: sourceDataArtifact
      type: string
      description: Produced trusted data artifact
  volumes:
    - name: workdir
      emptyDir: {}
  stepTemplate:
    volumeMounts:
      - mountPath: /var/workdir
        name: workdir
    env:
      - name: IMAGE_EXPIRES_AFTER
        value: $(params.ociArtifactExpiresAfter)
      - name: "ORAS_OPTIONS"
        value: "$(params.orasOptions)"
      - name: "DEBUG"
        value: "$(params.trustedArtifactsDebug)"
    securityContext:
      runAsUser: 1001
  steps:
    - name: use-trusted-artifact
      computeResources:
        limits:
          memory: 64Mi
          cpu: 30m
        requests:
          memory: 64Mi
          cpu: 30m
      ref:
        resolver: "git"
        params:
          - name: url
            value: $(params.taskGitUrl)
          - name: revision
            value: $(params.taskGitRevision)
          - name: pathInRepo
            value: stepactions/use-trusted-artifact/use-trusted-artifact.yaml
      params:
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(params.sourceDataArtifact)
    - name: create-test-files
      image: quay.io/konflux-ci/release-service-utils:d08bdfa3733a7c75d5334aaa77b7aa46fbace00b
      computeResources:
        limits:
          memory: 64Mi
          cpu: 30m
        requests:
          memory: 64Mi
          cpu: 30m
      script: |
        #!/usr/bin/env bash
        set -e

        echo "Creating test artifacts.json file..."
        cat > $(params.dataDir)/$(params.artifactsJsonPath) <<'EOF'
        {
          "artifacts": {
            "test-build1/pulp_results.json": {
              "labels": {
                "arch": "",
                "date": "2026-04-28 17:33:14",
                "build_id": "test-build1",
                "namespace": "rok-test"
              },
              "url": "https://packages.redhat.com/api/pulp-content/konflux-direct-signing-test/test-build1/logs/pulp_results.json",
              "sha256": "c114c7ed9381bbffdd15798021ec12b29b1b8ec2131de1abf43a619dc4744da1"
            },
            "samba-4.23.4-1.el9.src.rpm": {
              "labels": {
                "arch": "src",
                "date": "2026-04-28 17:33:14",
                "build_id": "test-build1",
                "namespace": "rok-test"
              },
              "url": "https://packages.redhat.com/api/pulp-content/konflux-direct-signing-test/test-build1/rpms/Packages/s/samba-4.23.4-1.el9.src.rpm",
              "sha256": "105dc0785c7d10cfe1e757b7443a61d999061381ec310f177c8da8dbc7cde30e"
            },
            "bash-completion-2.11-5.el9.noarch.rpm": {
              "labels": {
                "arch": "noarch",
                "date": "2026-04-28 17:33:14",
                "build_id": "test-build1",
                "namespace": "rok-test"
              },
              "url": "https://packages.redhat.com/api/pulp-content/konflux-direct-signing-test/test-build1/rpms/Packages/b/bash-completion-2.11-5.el9.noarch.rpm",
              "sha256": "3a949c0111df035a47dd93bc043a5e0bf778f992e1620ad4ab47dbe29e9d112e"
            },
            "samba-gpupdate-4.23.4-1.el9.noarch.rpm": {
              "labels": {
                "arch": "noarch",
                "date": "2026-04-28 17:33:14",
                "build_id": "test-build1",
                "namespace": "rok-test"
              },
              "url": "https://packages.redhat.com/api/pulp-content/konflux-direct-signing-test/test-build1/rpms/Packages/s/samba-gpupdate-4.23.4-1.el9.noarch.rpm",
              "sha256": "9a142bf84f0e5429e49679cf21ab2f6f73e158500a8a498cfd31263695df42e8"
            }
          },
          "distributions": {
            "rpms": "https://packages.redhat.com/api/pulp-content/konflux-direct-signing-test/test-build1/rpms/",
            "logs": "https://packages.redhat.com/api/pulp-content/konflux-direct-signing-test/test-build1/logs/",
            "sbom": "https://packages.redhat.com/api/pulp-content/konflux-direct-signing-test/test-build1/sbom/",
            "artifacts": "https://packages.redhat.com/api/pulp-content/konflux-direct-signing-test/test-build1/artifacts/"
          }
        }
        EOF

        echo "All test files created successfully!"
        echo "Listing files in $(params.dataDir):"
        ls -lh $(params.dataDir)/
        echo ""
        echo "Content of artifacts.json:"
        cat $(params.dataDir)/$(params.artifactsJsonPath)

    - name: rh-sign-rpm
      image: quay.io/konflux-ci/release-service-utils@sha256:5546fa78d3c88d7b6a2e8cff8902f7757f00541d0bbaf113b9f293133894afa3
      computeResources:
        limits:
          memory: 2Gi
          cpu: "1"
        requests:
          memory: 2Gi
          cpu: "1"
      env:
        - name: SNAPSHOT_SPEC_FILE
          value: $(params.dataDir)/$(params.snapshotPath)
        - name: DATA_FILE
          value: $(params.dataDir)/$(params.dataPath)
        - name: ARTIFACTS_JSON_FILE
          value: $(params.dataDir)/$(params.artifactsJsonPath)
      script: |
        #!/usr/bin/env bash
        set -e

        if [ ! -f "${SNAPSHOT_SPEC_FILE}" ] ; then
            echo "No valid snapshot file was provided."
            exit 1
        fi

        if [ ! -f "${DATA_FILE}" ] ; then
            echo "No data JSON was provided."
            exit 1
        fi

        RPA_FILE="$(params.dataDir)/$(params.releasePlanAdmissionPath)"
        if [ ! -f "${RPA_FILE}" ] ; then
            echo "No valid rpa file was provided."
            exit 1
        fi

        # Validate artifacts.json if needed for dynamic architecture detection
        if [ -z "$(params.snapshotBuildId)" ]; then
            if [ -z "$(params.artifactsJsonPath)" ] || [ ! -f "${ARTIFACTS_JSON_FILE}" ]; then
                echo "Error: snapshotBuildId is empty, so artifacts.json is required for dynamic architecture detection"
                echo "Please provide either snapshotBuildId or a valid artifactsJsonPath"
                exit 1
            fi
        fi

        set -x

        PIPELINERUN_LABEL="internal-services.appstudio.openshift.io/pipelinerun-uid"

        # Extract signing configuration from data file
        KERBEROS_PRINCIPAL=$(jq --exit-status -r '.signOptions.signKeytab.principal' "${DATA_FILE}")
        KERBEROS_KEYTAB=$(jq --exit-status -r '.signOptions.signKeytab.name' "${DATA_FILE}")
        KERBEROS_KEYTAB_SECRET=$(jq --exit-status -r '.signOptions.signKeytab.secret' "${DATA_FILE}")
        SIGNING_ALIAS=$(jq --exit-status -r '.signOptions.signKeyAlias.key' "${DATA_FILE}")
        ARTIFACT_STORAGE_SECRET=$(jq --exit-status -r '.signOptions.artifactStorageSecret // "signing-artifact-storage-preprod"' "${DATA_FILE}")

        # Calculate timeouts - pipeline timeout is requestTimeout + 5 minutes for overhead
        requestTimeout=$(params.requestTimeout)
        pipelineTimeoutSeconds=$((requestTimeout+300))
        pipelineTimeout=$(date -u -d @"${pipelineTimeoutSeconds}" +"%Hh%Mm%Ss")
        taskTimeout=$(date -u -d @"${requestTimeout}" +"%Hh%Mm%Ss")

        ARTIFACT_JSON=$(base64 -w0 < "${ARTIFACTS_JSON_FILE}")

        echo "Creating internal-request for RPM signing (pipeline: $(params.signPipeline))..."

        # Disable command echoing to prevent logging sensitive parameters
        set +x
        internal-request \
          --pipeline "$(params.signPipeline)" \
          -p pipeline_image="$(params.pipelineImage)" \
          -p artifact_json="${ARTIFACT_JSON}" \
          -p kerberos_principal="${KERBEROS_PRINCIPAL}" \
          -p kerberos_keytab="${KERBEROS_KEYTAB}" \
          -p kerberos_keytab_secret="${KERBEROS_KEYTAB_SECRET}" \
          -p signing_alias="${SIGNING_ALIAS}" \
          -p artifact_storage_secret="${ARTIFACT_STORAGE_SECRET}" \
          -p destination_artifact_storage_domain="$(params.signedRpmsDomain)" \
          -p requester="$(params.requester)" \
          -p force="false" \
          -p taskGitUrl="$(params.signingRepo)" \
          -p taskGitRevision="$(params.signingRevision)" \
          -l ${PIPELINERUN_LABEL}="$(params.pipelineRunUid)" \
          -t "$(params.requestTimeout)" \
          --service-account "$(params.signPipelineServiceAccount)" \
          --pipeline-timeout "${pipelineTimeout}" \
          --task-timeout "$taskTimeout" \
          -s true

        echo "RPM signing request completed"
    - name: create-trusted-artifact
      computeResources:
        limits:
          memory: 128Mi
          cpu: 250m
        requests:
          memory: 128Mi
          cpu: 250m
      ref:
        resolver: "git"
        params:
          - name: url
            value: "$(params.taskGitUrl)"
          - name: revision
            value: "$(params.taskGitRevision)"
          - name: pathInRepo
            value: stepactions/create-trusted-artifact/create-trusted-artifact.yaml
      params:
        - name: ociStorage
          value: $(params.ociStorage)
        - name: workDir
          value: $(params.dataDir)
        - name: sourceDataArtifact
          value: $(results.sourceDataArtifact.path)
