---
apiVersion: tekton.dev/v1
kind: Task
metadata:
  name: direct-sign-and-upload
  annotations:
    tekton.dev/pipelines.minVersion: "0.12.1"
    tekton.dev/tags: release
spec:
  description: |-
    Tekton task to directly sign container images using rh-signing-client-stage and upload
    signatures to Pyxis.
    - This task bypasses UMB/robosignatory and calls the signing client directly.
    - This task is meant to be used in an internal pipeline for container signing POC.
  params:
    - name: manifest_digests
      description: |
        List of space separated manifest digests for the signed content,
        usually in the format sha256:xxx
      type: string
    - name: references
      description: |
        List of space separated docker references for the signed content,
        e.g. registry.com/ns/image:v4.9 registry.com/ns/image:v4.10
      type: string
    - name: requester
      description: Name of the user that requested the signing, for auditing purposes
      type: string
    - name: sig_key_names
      description: Space separated signing key names that the content is signed with
      type: string
      default: containerisvsign
    - name: pipeline_image
      description: Signing client image to use for the direct-sign step
      type: string
      default: "images.paas.redhat.com/chuazhan/sign-client-image:latest"
    - name: caTrustConfigMapName
      description: The name of the ConfigMap to read CA bundle data from
      type: string
      default: trusted-ca
    - name: caTrustConfigMapKey
      description: The name of the key in the ConfigMap that contains the CA bundle data
      type: string
      default: ca-bundle.crt
  volumes:
    - name: secret-volume
      secret:
        secretName: konflux-release-signing-stage-sa
    - name: trusted-ca
      configMap:
        name: $(params.caTrustConfigMapName)
        items:
          - key: $(params.caTrustConfigMapKey)
            path: ca-bundle.crt
        optional: true
  stepTemplate:
    volumeMounts:
      - name: trusted-ca
        mountPath: /mnt/trusted-ca
        readOnly: true
  steps:
    - name: direct-sign
      image: "$(params.pipeline_image)"
      securityContext:
        runAsUser: 1001
      computeResources:
        limits:
          memory: 256Mi
          cpu: 200m
        requests:
          memory: 256Mi
          cpu: 200m
      workingDir: "$(workspaces.data.path)"
      volumeMounts:
        - name: secret-volume
          mountPath: /etc/secret
          readOnly: true
      env:
        - name: manifest_digests
          value: $(params.manifest_digests)
        - name: references
          value: $(params.references)
        - name: sig_key_names
          value: "$(params.sig_key_names)"
        - name: requester
          value: "$(params.requester)"
      script: |
        #!/usr/bin/env bash
        set -ex

        echo "=== Decoding Kerberos keytab ==="
        base64 --decode /etc/secret/keytab > ./signing.keytab

        echo "=== Listing available signing keys ==="
        rh-signing-client-stage --keytab ./signing.keytab --list-keys
  workspaces:
    - name: data
